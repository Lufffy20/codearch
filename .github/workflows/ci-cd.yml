name: Yii2 CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: codearch_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # PHP Setup
      # -------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo, pdo_mysql
          ini-values: error_reporting=E_ALL, display_errors=On

      # -------------------------
      # Composer
      # -------------------------
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Optimize autoloader
        run: composer dump-autoload --optimize --classmap-authoritative

      # -------------------------
      # MySQL Ready Check
      # -------------------------
      - name: Wait for MySQL
        run: |
          sleep 10
          mysql -h 127.0.0.1 -u root -proot -e "SELECT 1;"

      # -------------------------
      # Codeception local configs
      # -------------------------
      - name: Create Codeception local configs
        run: |
          # COMMON (DB only)
          echo '<?php return [
            "class" => "yii\db\Connection",
            "dsn" => "mysql:host=127.0.0.1;dbname=codearch_test",
            "username" => "root",
            "password" => "root",
            "charset" => "utf8",
          ];' > common/config/codeception-local.php

          # FRONTEND
          echo '<?php return [
            "id" => "frontend-tests",
            "basePath" => dirname(__DIR__, 2)."/frontend",
            "vendorPath" => dirname(__DIR__, 2)."/vendor",
            "components" => [
              "db" => [
                "class" => "yii\db\Connection",
                "dsn" => "mysql:host=127.0.0.1;dbname=codearch_test",
                "username" => "root",
                "password" => "root",
                "charset" => "utf8",
              ],
              "mailer" => ["useFileTransport" => true],
              "request" => ["cookieValidationKey" => "test-key"],
            ],
          ];' > frontend/config/codeception-local.php

          # BACKEND
          echo '<?php return [
            "id" => "backend-tests",
            "basePath" => dirname(__DIR__, 2)."/backend",
            "vendorPath" => dirname(__DIR__, 2)."/vendor",
            "components" => [
              "db" => [
                "class" => "yii\db\Connection",
                "dsn" => "mysql:host=127.0.0.1;dbname=codearch_test",
                "username" => "root",
                "password" => "root",
                "charset" => "utf8",
              ],
              "mailer" => ["useFileTransport" => true],
              "request" => ["cookieValidationKey" => "test-key"],
            ],
          ];' > backend/config/codeception-local.php

      # -------------------------
      # Permissions
      # -------------------------
      - name: Set permissions
        run: |
          chmod -R 777 frontend/runtime frontend/web/assets
          chmod -R 777 backend/runtime backend/web/assets

      # -------------------------
      # DB Migrations
      # -------------------------
      - name: Run migrations
        run: |
          if [ -f "yii" ]; then
            php yii migrate --interactive=0
          elif [ -f "console/yii" ]; then
            php console/yii migrate --interactive=0
          else
            echo "No yii console found, skipping migrations"
          fi
        env:
          YII_ENV: test

      # -------------------------
      # ✅ RUN TESTS - YII2 ADVANCED STRUCTURE
      # -------------------------

      - name: Run frontend tests
        run: |
          cd frontend/tests
          ../../vendor/bin/codecept run
        continue-on-error: false

      - name: Run backend tests
        run: |
          cd backend/tests
          ../../vendor/bin/codecept run
        continue-on-error: false
