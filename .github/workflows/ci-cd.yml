name: Yii2 CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: codearch_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      YII_ENV: test
      YII_DEBUG: true

    steps:
      # -------------------------
      # Checkout
      # -------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # -------------------------
      # PHP Setup
      # -------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo, pdo_mysql
          ini-values: error_reporting=E_ALL, display_errors=On

      # -------------------------
      # Composer
      # -------------------------
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Optimize autoloader
        run: composer dump-autoload --optimize

      # -------------------------
      # Yii Init (safe for CI)
      # -------------------------
      - name: Yii2 init
        run: php init --env=Development --overwrite=All

      # -------------------------
      # Wait for MySQL
      # -------------------------
      - name: Wait for MySQL
        run: |
          for i in {1..12}; do
            mysql -h 127.0.0.1 -u root -proot -e "SELECT 1" && exit 0
            echo "⏳ Waiting for MySQL..."
            sleep 5
          done
          echo "❌ MySQL not ready" && exit 1

      # -------------------------
      # 🔥 FIX: Console DB config
      # -------------------------
      - name: Create main-local.php (DB for console)
        run: |
          cat <<'PHP' > common/config/main-local.php
          <?php
          return [
              'components' => [
                  'db' => [
                      'class' => 'yii\db\Connection',
                      'dsn' => 'mysql:host=127.0.0.1;port=3306;dbname=codearch_test',
                      'username' => 'root',
                      'password' => 'root',
                      'charset' => 'utf8',
                  ],
              ],
          ];
          PHP

      # -------------------------
      # Codeception configs
      # -------------------------
      - name: Create Codeception configs
        run: |
          cat <<'PHP' > common/config/codeception-local.php
          <?php
          return require __DIR__ . '/main-local.php';
          PHP

          cat <<'PHP' > frontend/config/codeception-local.php
          <?php
          return [
              'id' => 'frontend-tests',
              'components' => [
                  'db' => require dirname(__DIR__, 2) . '/common/config/main-local.php',
                  'mailer' => ['useFileTransport' => true],
                  'request' => ['cookieValidationKey' => 'test-key'],
              ],
          ];
          PHP

          cat <<'PHP' > backend/config/codeception-local.php
          <?php
          return [
              'id' => 'backend-tests',
              'components' => [
                  'db' => require dirname(__DIR__, 2) . '/common/config/main-local.php',
                  'mailer' => ['useFileTransport' => true],
                  'request' => ['cookieValidationKey' => 'test-key'],
              ],
          ];
          PHP

      # -------------------------
      # Permissions
      # -------------------------
      - name: Set permissions
        run: |
          chmod -R 777 frontend/runtime frontend/web/assets
          chmod -R 777 backend/runtime backend/web/assets

      # -------------------------
      # Migrations (NOW FIXED)
      # -------------------------
      - name: Run migrations
        run: php yii migrate --interactive=0

      # -------------------------
      # Tests
      # -------------------------
      - name: Run frontend tests
        run: vendor/bin/codecept run -- -c frontend

      - name: Run backend tests
        run: vendor/bin/codecept run -- -c backend
