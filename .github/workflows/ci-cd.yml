name: Yii2 CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: codearch_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo, pdo_mysql

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Wait for MySQL
        run: |
          sleep 10s
          # Verify MySQL is accessible
          mysql -h 127.0.0.1 -u root -proot -e "SELECT 1;"

      - name: Create Codeception local configs
        run: |
          echo '<?php return [
            "class" => "yii\db\Connection",
            "dsn" => "mysql:host=127.0.0.1;dbname=codearch_test",
            "username" => "root",
            "password" => "root",
            "charset" => "utf8",
          ];' > common/config/codeception-local.php
          
          echo "<?php return [];" > backend/config/codeception-local.php
          echo "<?php return [];" > frontend/config/codeception-local.php

      - name: Set permissions
        run: |
          chmod -R 777 backend/runtime
          chmod -R 777 frontend/runtime

      - name: Run database migrations
        run: |
          php yii migrate/up --interactive=0
        env:
          YII_ENV: test

      - name: Run Codeception tests
        run: vendor/bin/codecept run
